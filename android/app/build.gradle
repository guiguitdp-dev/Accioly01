plugins {
    id 'com.android.application'
}

// Endereço que o app abre. Vazio = o app pergunta o endereço na primeira vez (APK universal).
// Para clientes, fixe o endereço: gradle assembleDebug -PappUrl=https://seu-dominio.com.br/tv/
def appUrl = (project.findProperty('appUrl') ?: '').toString().replace('"', '')

android {
    namespace 'com.acciolyplay.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.acciolyplay.tv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
