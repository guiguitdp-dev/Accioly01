plugins {
    id 'com.android.application'
}

// Endereço que o app abre. Vazio = o app pergunta o endereço na primeira vez (APK universal).
// Para clientes, fixe o endereço: gradle assembleDebug -PappUrl=https://seu-dominio.com.br/tv/
def appUrl = (project.findProperty('appUrl') ?: '').toString().replace('"', '')
// AdMob: ID do APP (fica no AndroidManifest). Sem informar, usa o ID de TESTE do Google.
// Build com o seu: gradle assembleDebug -PadmobAppId=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
def admobAppId = (project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713').toString().trim()

android {
    namespace 'com.acciolyplay.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.acciolyplay.tv'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        manifestPlaceholders = [admobAppId: admobAppId]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Anúncios AdMob (tela cheia e recompensado) + consentimento (UMP)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
