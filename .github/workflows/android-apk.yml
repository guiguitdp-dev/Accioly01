# Gera o APK do Accioly Play para Android TV / Google TV / TV Box / Fire TV.
# Como usar: GitHub > Actions > "Gerar APK Android TV" > Run workflow > informe o endereço do app.
# Ao terminar, baixe o APK em "Artifacts" e copie para o pendrive.
name: Gerar APK Android TV

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Endereço fixo do app (ex.: https://seudominio.com.br/tv/). Deixe vazio para o app abrir direto nos canais (Modo Dono, sem servidor).'
        required: false
        default: ''
      admob_app_id:
        description: 'ID do app no AdMob (ca-app-pub-...~...). Vazio = ID de teste do Google.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # O app da TV vai DENTRO do APK: sem servidor configurado, o APK abre
      # direto nos canais (Modo Dono, igual ao pendrive), mesmo sem PC ligado.
      - name: Embutir o app no APK
        run: |
          rm -rf android/app/src/main/assets/app
          mkdir -p android/app/src/main/assets
          cp -r app android/app/src/main/assets/app
          rm -f android/app/src/main/assets/app/sw.js
          # Servido por https://appassets.androidplatform.net -> força o Modo Dono
          printf "window.APP_CONFIG = {\n  name: 'Accioly Play',\n  serverUrl: '',\n  localMode: true\n};\n" > android/app/src/main/assets/app/js/config.js
          test -f android/app/src/main/assets/app/index.html
      - name: Compilar APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || '' }}
          ADMOB_APP_ID: ${{ inputs.admob_app_id || '' }}
        run: gradle --no-daemon assembleDebug -PappUrl="$APP_URL" ${ADMOB_APP_ID:+-PadmobAppId="$ADMOB_APP_ID"}
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcciolyPlay-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AcciolyPlay-AndroidTV
          path: AcciolyPlay-AndroidTV.apk
