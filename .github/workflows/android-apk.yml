# Gera o APK do Accioly Play para Android TV / Google TV / TV Box / Fire TV.
# Como usar: GitHub > Actions > "Gerar APK Android TV" > Run workflow > informe o endereço do app.
# Ao terminar, baixe o APK em "Artifacts" e copie para o pendrive.
name: Gerar APK Android TV

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - 'scripts/news.js'
      - 'server/lib/news.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Endereço fixo do app (ex.: https://seudominio.com.br/tv/). Deixe vazio para o app perguntar na 1ª abertura.'
        required: false
        default: ''
      admob_app_id:
        description: 'ID do app no AdMob (ca-app-pub-...~...). Vazio = ID de teste do Google.'
        required: false
        default: ''

permissions:
  contents: write   # para publicar o APK no link fixo de download (Release "app-latest")

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      # Assinatura SEMPRE a mesma: sem isso cada APK sai com uma chave nova e o Android
      # recusa instalar a atualização por cima do app antigo ("app não instalado").
      # Opcional (mais seguro e permanente): crie o segredo ANDROID_KEYSTORE_B64 com o
      # arquivo debug.keystore em base64 (Settings > Secrets and variables > Actions).
      - name: Chave de assinatura (do segredo)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore && echo "Usando a chave do segredo ANDROID_KEYSTORE_B64"; fi
      - name: Chave de assinatura (guardada entre as compilações)
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: accioly-assinatura-v1
      # Notícias do dia embutidas: o app abre com notícias mesmo antes da internet carregar
      - name: Notícias embutidas
        run: node scripts/news.js --snapshot app/js/noticias-snapshot.js --min 20 || true
      - name: Compilar APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || '' }}
          ADMOB_APP_ID: ${{ inputs.admob_app_id || '' }}
        run: gradle --no-daemon assembleDebug -PappUrl="$APP_URL" ${ADMOB_APP_ID:+-PadmobAppId="$ADMOB_APP_ID"}
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcciolyPlay-AndroidTV.apk
      # APK VITRINE: para mostrar a outras pessoas (acesso total por 30 min e depois convite para assinar).
      # WhatsApp e site de vendas: GitHub > Settings > Secrets and variables > Actions > Variables
      #   ACCIOLY_WHATSAPP = 5511999999999   ACCIOLY_SITE = https://seusite.com.br
      - name: Compilar APK vitrine
        working-directory: android
        env:
          BUY_WHATSAPP: ${{ vars.ACCIOLY_WHATSAPP }}
          BUY_SITE: ${{ vars.ACCIOLY_SITE }}
        run: |
          gradle --no-daemon assembleDebug -Pvitrine=true -PbuyWhatsapp="$BUY_WHATSAPP" -PbuySite="$BUY_SITE"
          cp app/build/outputs/apk/debug/app-debug.apk ../AcciolyPlay-Vitrine.apk
      - uses: actions/upload-artifact@v6
        with:
          name: AcciolyPlay-AndroidTV
          path: |
            AcciolyPlay-AndroidTV.apk
            AcciolyPlay-Vitrine.apk
      # Link fixo para baixar no celular/TV (só quando é o main):
      # https://github.com/<dono>/<repo>/releases/download/app-latest/AcciolyPlay.apk
      - name: Publicar link de download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp AcciolyPlay-AndroidTV.apk AcciolyPlay.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest AcciolyPlay.apk AcciolyPlay-Vitrine.apk --target "$GITHUB_SHA" \
            --title "Accioly Play — APK mais recente" \
            --notes "AcciolyPlay.apk = app do dono (tudo liberado). AcciolyPlay-Vitrine.apk = demonstração para mostrar a outras pessoas. AcciolyPlay-Pendrive.zip = pendrive vitrine completo (aparece alguns minutos depois). Instale no celular Android, Android TV, TV Box ou Fire TV. Gerado a partir do commit ${GITHUB_SHA::7}." \
            --latest
