# Gera o APK do Accioly Play para Android TV / Google TV / TV Box / Fire TV.
# Como usar: GitHub > Actions > "Gerar APK Android TV" > Run workflow > informe o endereço do app.
# Ao terminar, baixe o APK em "Artifacts" e copie para o pendrive.
name: Gerar APK Android TV

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Endereço do app (ex.: https://seudominio.com.br/tv/ ou http://192.168.0.10:3000/tv/)'
        required: true
        default: 'http://192.168.0.10:3000/tv/'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url }}
        run: gradle --no-daemon assembleDebug -PappUrl="$APP_URL"
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcciolyPlay-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AcciolyPlay-AndroidTV
          path: AcciolyPlay-AndroidTV.apk
