# Gera o APK do Accioly Play para Android TV / Google TV / TV Box / Fire TV.
# Como usar: GitHub > Actions > "Gerar APK Android TV" > Run workflow > informe o endereço do app.
# Ao terminar, baixe o APK em "Artifacts" e copie para o pendrive.
name: Gerar APK Android TV

on:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - 'scripts/news.js'
      - 'server/lib/news.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Endereço fixo do app (ex.: https://seudominio.com.br/tv/). Deixe vazio para o app perguntar na 1ª abertura.'
        required: false
        default: ''
      admob_app_id:
        description: 'ID do app no AdMob (ca-app-pub-...~...). Vazio = ID de teste do Google.'
        required: false
        default: ''

permissions:
  contents: write   # para publicar o APK no link fixo de download (Release "app-latest")

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      # Assinatura SEMPRE a mesma: sem isso cada APK sai com uma chave nova e o Android
      # recusa instalar a atualização por cima do app antigo ("app não instalado").
      # Mais seguro e permanente: crie o segredo ANDROID_KEYSTORE_B64 (arquivo debug.keystore
      # em base64) em Settings > Secrets and variables > Actions. Sem ele, a chave fica guardada
      # no cache do GitHub Actions deste repositório.
      - name: Chave de assinatura (guardada)
        uses: actions/cache/restore@v5
        with:
          path: ~/.android/debug.keystore
          key: accioly-assinatura-v1
      - name: Chave de assinatura (segredo, se existir)
        id: chave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "segredo=sim" >> "$GITHUB_OUTPUT"; echo "Usando a chave do segredo ANDROID_KEYSTORE_B64"
          else
            echo "segredo=nao" >> "$GITHUB_OUTPUT"
            [ -f ~/.android/debug.keystore ] && echo "Usando a chave guardada" || echo "Primeira compilação: uma chave nova será criada e guardada"
          fi
      # Notícias do dia embutidas: o app abre com notícias mesmo antes da internet carregar
      - name: Notícias embutidas
        run: node scripts/news.js --snapshot app/js/noticias-snapshot.js --min 20 || true
      # O APK é a VITRINE (demonstração + convite para assinar). O dono libera tudo no próprio
      # aparelho com o código do dono (Conta > Sou o dono). WhatsApp/site do convite:
      # Settings > Secrets and variables > Actions > Variables: ACCIOLY_WHATSAPP e ACCIOLY_SITE
      - name: Compilar APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || '' }}
          ADMOB_APP_ID: ${{ inputs.admob_app_id || '' }}
          BUY_WHATSAPP: ${{ vars.ACCIOLY_WHATSAPP }}
          BUY_SITE: ${{ vars.ACCIOLY_SITE }}
        run: gradle --no-daemon assembleDebug -PappUrl="$APP_URL" -PbuyWhatsapp="$BUY_WHATSAPP" -PbuySite="$BUY_SITE" ${ADMOB_APP_ID:+-PadmobAppId="$ADMOB_APP_ID"}
      - name: Guardar a chave de assinatura
        if: steps.chave.outputs.segredo == 'nao' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        continue-on-error: true   # já guardada: não precisa de novo
        with:
          path: ~/.android/debug.keystore
          key: accioly-assinatura-v1
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AcciolyPlay.apk
      - uses: actions/upload-artifact@v6
        with:
          name: AcciolyPlay-AndroidTV
          path: AcciolyPlay.apk
      # Link fixo para baixar no celular/TV (só quando é o main):
      # https://github.com/<dono>/<repo>/releases/download/app-latest/AcciolyPlay.apk
      # Atualiza só o APK (o pendrive e o vídeo do mesmo release continuam no ar).
      - name: Publicar link de download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="AcciolyPlay.apk = app para celular Android, Android TV, TV Box e Fire TV (demonstração com tempo; o dono libera tudo com o código do dono em Conta > Sou o dono). AcciolyPlay-Pendrive.zip = pendrive vitrine completo. AcciolyPlay-Video.mp4 = vídeo de demonstração. Commit ${GITHUB_SHA::7}."
          if gh release view app-latest >/dev/null 2>&1; then
            git tag -f app-latest "$GITHUB_SHA" && git push -f origin refs/tags/app-latest
            gh release upload app-latest AcciolyPlay.apk --clobber
            gh release edit app-latest --notes "$NOTAS" --latest
            gh release delete-asset app-latest AcciolyPlay-Vitrine.apk --yes 2>/dev/null || true
          else
            gh release create app-latest AcciolyPlay.apk --target "$GITHUB_SHA" --title "Accioly Play — APK mais recente" --notes "$NOTAS" --latest
          fi
