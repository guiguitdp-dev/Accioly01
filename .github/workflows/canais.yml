# Verifica os canais do catálogo a cada 6 horas (ZERO tokens de IA).
# Observação: os servidores do GitHub ficam fora do Brasil; alguns sinais
# brasileiros podem aparecer como falha por bloqueio regional. A verificação
# "oficial" é a do seu servidor (Painel do Dono > Canais e Jogos).
name: Verificar canais

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-channels.js --json canais.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-canais
          path: canais.json
