# Publica o app (vitrine; o dono libera tudo com o código do dono) como site: abra no iPhone pelo Safari e use
# "Compartilhar → Adicionar à Tela de Início". Também funciona em qualquer navegador.
# Endereço: https://<dono>.github.io/<repo>/
# 1ª vez: GitHub → Settings → Pages → Source: "GitHub Actions" (um clique).
name: Publicar app web (iPhone e navegador)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Sem o Pages ativado, só avisa (em vez de falhar toda vez)
  verificar:
    runs-on: ubuntu-latest
    outputs:
      ativo: ${{ steps.pages.outputs.ativo }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then echo "ativo=true" >> "$GITHUB_OUTPUT"; else
            echo "ativo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site do iPhone desligado::Para publicar o app para iPhone: GitHub > Settings > Pages > Source: GitHub Actions (uma vez só)."
          fi
  deploy:
    needs: verificar
    if: needs.verificar.outputs.ativo == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: "Montar o site (vitrine; o dono libera tudo com o código do dono)"
        env:
          ACCIOLY_WHATSAPP: ${{ vars.ACCIOLY_WHATSAPP }}
          ACCIOLY_SITE: ${{ vars.ACCIOLY_SITE }}
        run: |
          mkdir -p _site
          cp -r app/. _site/
          node scripts/config-publica.js _site/js/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
