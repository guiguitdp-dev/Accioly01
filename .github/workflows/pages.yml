# Publica o app (modo dono) como site: abra no iPhone pelo Safari e use
# "Compartilhar → Adicionar à Tela de Início". Também funciona em qualquer navegador.
# Endereço: https://<dono>.github.io/<repo>/
# 1ª vez: GitHub → Settings → Pages → Source: "GitHub Actions" (um clique).
name: Publicar app web (iPhone e navegador)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r app/. _site/
          sed -i "s/localMode: 'auto'/localMode: true/" _site/js/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
